name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution 🛠️
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: |
          rm -rf build dist *.egg-info
          python -m build

      - name: Verify Vision facade wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          forbidden_prefixes = (
              "mblt_model_zoo/vision/models/",
              "mblt_model_zoo/vision/utils/datasets/",
              "mblt_model_zoo/vision/utils/evaluation/",
              "mblt_model_zoo/vision/utils/postprocess/",
              "mblt_model_zoo/vision/utils/preprocess/",
          )
          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              forbidden = [
                  name
                  for name in archive.namelist()
                  if name.startswith(forbidden_prefixes)
              ]
          if forbidden:
              raise SystemExit(
                  "Wheel contains legacy Vision implementation files:\n"
                  + "\n".join(forbidden)
              )
          PY

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI 🧪
    needs: [build]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI 🚀
    needs: [build, publish-to-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
