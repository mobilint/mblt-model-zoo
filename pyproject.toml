[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"


# Project setting -----------------------------
[project]
name = "mblt-model-zoo"
authors = [
    {"name" = "Mobilint Inc.", email = "tech-support@mobilint.com"},
]
dynamic = ["version"]
description = "Deprecated: use mblt-vision-python, transformers-mblt, and melotts-mblt. Compatibility layer for pre-quantized AI models on Mobilint NPUs."
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10,<3.13"
keywords = ["quantization", "NPU", "model zoo", "pre-quantized models", "inference", "mobilint", "mblt", "aries", "regulus", "qb"]
dependencies = [
    "mobilint-qb-runtime>=1.4.0",
    "numpy>=1.26.0",
    "torch>=2.4.1",
    "opencv-python>=4.11.0.86",
    "pillow>=11.1.0",
    "faster-coco-eval",
    "huggingface-hub",
    "scipy",
    "requests>=2.32.0",
    "gdown>=5.2.0",
    "tqdm",
    "mblt-tracker>=1.0.1",
    "PyYAML",
    "matplotlib",
    "cityscapesScripts",
    "mblt-npu-python>=0.1.0",
    "mblt-vision-python>=0.0.2",
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: BSD License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Home = "https://www.mobilint.com/"
Repository  = "https://github.com/mobilint/mblt-model-zoo"

[project.scripts]
mblt-model-zoo = "mblt_model_zoo.cli:main"
mblt-melotts-download = "mblt_model_zoo.utils.melotts_download:main"

[project.optional-dependencies]
# The Hugging Face Transformers integration is maintained in transformers-mblt; it pins the supported
# `transformers[serving]` range and its own runtime requirements.
transformers = [
    "transformers-mblt>=0.0.0",
]
# MeloTTS is maintained in melotts-mblt, which pins its text-processing, UI, and transformers-mblt requirements.
MeloTTS = [
    "melotts-mblt>=0.0.0",
]
onnxruntime = [
    "onnx",
    "onnxruntime",
]
onnxruntime-gpu = [
    "onnx; sys_platform != 'darwin'",
    "onnxruntime-gpu; sys_platform != 'darwin'",
]
qwen-asr = [
    "transformers-mblt[qwen-asr]>=0.0.0",
]
qbcompiler = [
    "qbcompiler>=1.3.0",
    "onnxruntime",
]

# Tools setting -----------------------------------------
[tool.setuptools]
packages = { find = { where = ["."], include = ["mblt_model_zoo","mblt_model_zoo.*"] } }

[tool.setuptools.dynamic]
version = { attr = "mblt_model_zoo.__version__" }


[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "hf_xet",
    "build",
    "ruff",
]

[tool.pytest.ini_options]
filterwarnings = [
    # The compatibility facades warn on import by design; tests/test_deprecation.py checks those warnings.
    "ignore::mblt_model_zoo._deprecation.MbltModelZooDeprecationWarning",
]
markers = [
    "full_matrix: additional transformer model/core matrix cases enabled by --full-matrix.",
    "requires_network: test downloads models, datasets, or other remote artifacts.",
    "requires_npu: test requires a configured Mobilint NPU runtime and device.",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["PLC0414"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
